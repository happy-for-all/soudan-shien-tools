name: Deploy One Step to Cloudflare Workers

on:
  # 完全手動デプロイ設定（ボタンを押した時だけ動く）
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
      # ==========================================
      # 1. リポジトリの準備
      # ==========================================
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # ==========================================
      # 2. ビルド処理（distフォルダの生成）
      # ==========================================
      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: build.py を実行して dist フォルダを準備
        run: python build.py

      # ==========================================
      # 3. デプロイ処理（Cloudflareへ送信）
      # ==========================================
      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wrangler（CF連携ツール）をインストール
        run: npm install -g wrangler

      - name: Cloudflare Workers へデプロイ
        env:
          # GitHub Secrets に CLOUDFLARE_API_TOKEN を登録しておくこと
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy
